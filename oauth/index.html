<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AUTOMAIT · sign-in code</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 18px;color:#14161a}
#c{word-break:break-all;background:#f3f6f4;border:1px solid #cfe0d8;padding:12px;border-radius:8px;font-family:monospace;font-size:14px}
button{margin-top:14px;width:100%;padding:16px;font-size:18px;border:0;border-radius:10px;background:#1f6f5c;color:#fff}</style></head>
<body><h1>Almost done</h1>
<p>Copy this and paste it back to Hermes in Discord.</p>
<div id="c"></div><button id="b">Copy</button><p id="m"></p>
<script>
var q=new URLSearchParams(location.search);var t=q.get('error')?('ERROR '+q.get('error')+' '+(q.get('error_description')||'')):(q.get('code')||'')+' '+(q.get('state')||'');
document.getElementById('c').textContent=t||'No code found in this link.';
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(t).then(function(){document.getElementById('m').textContent='Copied.'},function(){document.getElementById('m').textContent='Press and hold the text above to copy it.'})};
</script></body></html>
